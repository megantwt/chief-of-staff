<!DOCTYPE html>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:#F9FAFB;color:#111827;font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{color:#0F766E}
.wrap{max-width:1180px;margin:0 auto;padding:14px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}

.err{background:#FEF2F2;border:1px solid #FECACA;color:#991B1B;border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:10px;display:flex;flex-direction:column;gap:6px}
.note{font-size:12px;color:#4B5563;background:#fff;border:1px solid #E5E7EB;border-radius:10px;padding:8px 10px;margin:0 0 12px}

.gate{max-width:560px;margin:24px auto;display:flex;flex-direction:column;gap:14px}

.tour li.ok .tt{color:#4B7A73}
.tour .tt{flex:1;min-width:0}
.tour .go{min-height:30px;padding:0 10px;border-radius:8px;border:1px solid #0F766E;background:#0F766E;color:#fff;font-size:12px;font-weight:500;flex-shrink:0}
.tick{width:20px;height:20px;border-radius:999px;border:1.5px solid #0F766E;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#0F766E;margin-top:1px}

.tourhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bar{height:6px;background:#CCFBF1;border-radius:999px;overflow:hidden}.bar span{display:block;height:100%;background:#0F766E}

.qa{border:1px solid #E5E7EB;background:#fff;border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;margin-bottom:12px}

.qcard{border:1px solid #99F6E4;background:#F0FDFA;border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}

.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}

.f label{font-size:11px;font-weight:600;color:#115E59}

.cols{display:flex;flex-direction:column;gap:12px}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
section[data-tab]{display:none}
body[data-tab="today"] section[data-tab~="today"],body[data-tab="todo"] section[data-tab~="todo"],body[data-tab="projects"] section[data-tab~="projects"],body[data-tab="ideas"] section[data-tab~="ideas"]{display:flex}

.panel{display:flex;flex-direction:column;gap:8px;padding:2px 0 12px 30px}
.line{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.seg{display:flex;gap:4px}
.ideas{background:#FFFBEB;border-color:#FDE68A}
.ideas h2{color:#78350F}
.bumped{background:#F3F4F6;border:1px dashed #9CA3AF}

.empty{font-size:13px;color:#6B7280;padding:6px 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* briefs */
.briefwrap{display:flex;flex-direction:column;gap:12px;max-width:460px}
.notif{display:flex;gap:10px;align-items:flex-start;background:#E5E7EB;border-radius:16px;padding:10px 12px;font-size:13px}
.notif .app{width:30px;height:30px;border-radius:8px;background:#D97757;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700}
.chat{background:#fff;border:1px solid #E5E7EB;border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:12px}
.chathead{display:flex;justify-content:space-between;font-size:12px;color:#6B7280;border-bottom:1px solid #F3F4F6;padding-bottom:8px}
.msg{display:flex;flex-direction:column;gap:8px;font-size:14px}
.msg p{margin:0}
.bh{font-weight:600;font-size:14px;margin-top:4px}
.msg ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.dsvg{display:block}
.dsvg .ts{font-size:11px;font-family:Inter,system-ui,sans-serif}
.dsvg .th{font-size:12px;font-weight:600;font-family:Inter,system-ui,sans-serif}
.quote{border-left:3px solid #D1D5DB;padding:2px 0 2px 10px;color:#374151;font-style:italic}
.thumbs{display:flex;gap:6px;align-items:center}
.thumbs button{min-height:34px;min-width:44px;border-radius:999px;border:1px solid #D1D5DB;background:#fff}
.thumbs button.on{background:#0F766E;border-color:#0F766E;color:#fff}
/* about */
.prose{max-width:760px;display:flex;flex-direction:column;gap:14px}
.prose p{margin:0}
.flowrow{display:grid;grid-template-columns:110px 1fr;gap:10px}
.flowrow .lbl{font-size:12px;font-weight:600;color:#4B5563;padding-top:10px}
.boxes{display:flex;flex-wrap:wrap;gap:6px}
.box{flex:1 1 150px;border-radius:10px;padding:8px 10px;font-size:13px;border:1px solid}
.box b{display:block;font-weight:600}
.b-you{background:#F5F3FF;border-color:#DDD6FE;color:#4C1D95}
.b-store{background:#EFF6FF;border-color:#BFDBFE;color:#1E3A8A}
.b-run{background:#F0FDFA;border-color:#99F6E4;color:#134E4A}
.b-back{background:#FFFBEB;border-color:#FDE68A;color:#78350F}
.arrow{text-align:center;color:#9CA3AF;font-size:14px;line-height:1}
@media (max-width:600px){.flowrow{grid-template-columns:1fr}.flowrow .lbl{padding-top:0}.arrow{display:none}}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.cbox{background:#fff;border:1px solid #E5E7EB;border-radius:12px;padding:10px 12px;font-size:13px}
.cbox b{display:block;margin-bottom:2px}
</style>

<script>
// ======================================================================
// CONFIG: filled in by the chief-of-staff skill when it builds your copy.
// Left empty, this page runs on a sample week only.
// ======================================================================
const CONFIG = /*COS_CONFIG*/{
  "owner": "",
  "tz": "",
  "tasksDataSourceId": "",
  "tasksView": "",
  "proposalsView": "",
  "calendars": [],
  "repo": "https://github.com/megantwt/chief-of-staff"
}/*END_COS_CONFIG*/;
const LINKED = !!(CONFIG.tasksDataSourceId && CONFIG.tasksView && CONFIG.calendars && CONFIG.calendars.length);
const ZIP = CONFIG.repo + "/raw/main/chief-of-staff-skill.zip";

// ================= dates & helpers =================
const TZ = CONFIG.tz || Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC";
const pad = (n) => String(n).padStart(2, "0");
const ymd = (d) => new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" }).format(d);
const TODAY = () => ymd(new Date());
const addDays = (iso, n) => { const t = new Date(iso + "T12:00:00Z"); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0, 10); };
const diff = (iso) => Math.round((new Date(iso.slice(0, 10) + "T12:00:00Z") - new Date(TODAY() + "T12:00:00Z")) / 864e5);
const fmtD = (iso, o) => new Date(iso.slice(0, 10) + "T12:00:00Z").toLocaleDateString("en-US", Object.assign({ timeZone: "UTC" }, o));
const nice = (iso) => iso ? fmtD(iso, { weekday: "short", month: "short", day: "numeric" }) : "";
const short = (iso) => iso ? fmtD(iso, { month: "short", day: "numeric" }) : "";
const dowName = (iso) => fmtD(iso, { weekday: "long" });
const minsIn = (dt) => { const p = new Intl.DateTimeFormat("en-GB", { timeZone: TZ, hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).format(new Date(dt)).split(":"); return Number(p[0]) * 60 + Number(p[1]); };
const fm = (m) => Math.floor(m / 60) + ":" + pad(m % 60);
const hm = (s) => Number(s.slice(0, 2)) * 60 + Number(s.slice(3, 5));
const toHM = (m) => pad(Math.floor(m / 60)) + ":" + pad(m % 60);
const dur = (m) => ((m >= 60 ? Math.floor(m / 60) + "h" : "") + (m % 60 ? " " + (m % 60) + "m" : "")).trim();
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let uid = Date.now() % 100000;
const nid = () => "x" + (uid++);
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }, del(k) { try { localStorage.removeItem(k); } catch (e) {} } };

const KINDS = [
  { k: "classes", n: "Classes" }, { k: "deadlines", n: "Deadlines" }, { k: "exam", n: "Exams & interviews" },
  { k: "social", n: "Social" }, { k: "exercise", n: "Exercise" }, { k: "work", n: "Work & study" }, { k: "bday", n: "Birthdays" }
];
const QUOTES = [
  ["Well begun is half done.", "Aristotle"],
  ["It always seems impossible until it's done.", "Nelson Mandela"],
  ["You don't have to see the whole staircase, just take the first step.", "Martin Luther King Jr."],
  ["The secret of getting ahead is getting started.", "Attributed to Mark Twain"],
  ["Nothing will work unless you do.", "Maya Angelou"],
  ["Little by little, one travels far.", "J.R.R. Tolkien"],
  ["Energy and persistence conquer all things.", "Benjamin Franklin"],
  ["Do what you can, with what you have, where you are.", "Theodore Roosevelt"]
];

// ================= state =================
// S holds what's on screen in either mode. Items/props/events have the same shape in both.
const S = { mode: null, items: [], props: [], events: [], cals: [], loading: false, synced: null, err: "", errSample: false,
  view: "home", tab: "today", day: 0, brief: "pm", open: null, evOpen: null, bumpedOpen: false, laterOpen: false, undo: null, busy: {},
  tourOpen: true, gateInfo: null,
  qa: { text: "", force: "", card: null, queue: [], by: "", busy: "", note: "" } };
let mcp = null, sampler = null, canImg = false, mcpChecked = false;
const calByKey = (k) => S.cals.find((c) => c.k === k) || S.cals.find((c) => c.k === "work") || S.cals[0];
const calById = (id) => S.cals.find((c) => c.id === id);
const owner = () => S.mode === "sample" ? "Sam" : (CONFIG.owner || "");

// ================= sample mode =================
const SKEY = "cos-sample-v1";
let SD = null; // persisted sample data
function sampleWeek() {
  const T = TODAY(), dd = (n) => addDays(T, n);
  const E = (d, a, b, t, k, id) => ({ id: id || nid(), calId: k, day: dd(d), a: hm(a), b: hm(b), t, mine: true, guests: 0 });
  const A = (d, t, k) => ({ id: nid(), calId: k, day: dd(d), allDay: true, t, mine: true, guests: 0 });
  const I = (title, type, o) => Object.assign({ id: nid(), title, type, due: null, show: null, pct: null }, o || {});
  return {
    anchor: T,
    events: [
      E(0, "08:00", "09:00", "Gym", "exercise"), E(0, "10:30", "12:00", "Contracts", "classes"), E(0, "12:15", "13:15", "Lunch with Priya", "social"),
      E(0, "13:30", "15:00", "Tech Policy seminar", "classes"), E(0, "14:30", "15:30", "TA office hours", "work", "oh"), E(0, "16:00", "17:00", "Study group", "work"),
      E(0, "19:30", "21:00", "Dinner with friends", "social"),
      E(1, "09:00", "10:30", "Statistics", "classes"), E(1, "11:00", "12:00", "Career advising call", "work"), E(1, "14:00", "15:00", "Interview: Policy Fellowship", "exam"),
      E(1, "15:30", "17:00", "Contracts", "classes"), E(1, "18:00", "19:00", "Run along the river", "exercise"),
      E(2, "10:00", "11:30", "Tech Policy seminar", "classes"), E(2, "20:00", "22:00", "Jordan's birthday drinks", "social"),
      A(5, "Seminar paper outline due", "deadlines"), E(9, "09:00", "12:00", "Statistics final exam", "exam"), A(12, "Problem set 6 due", "deadlines")
    ],
    items: [
      I("Read Contracts ch. 7", "To-do", { due: dd(0) }), I("Problem set 5", "To-do", { due: dd(1) }), I("Email Prof. Lee about the RA role", "To-do"),
      I("Plan for Statistics final exam", "To-do", { due: dd(8), pct: 20 }), I("Book flights home for winter break", "To-do", { show: dd(6) }),
      I("Renew library books", "To-do", { show: dd(3) }), I("Seminar paper", "Project", { due: dd(25), pct: 35 }), I("Personal website", "Project", { pct: 10 }),
      I("Learn SQL", "Project", { show: dd(14) }), I("Start a podcast on tech policy", "Idea"), I("Run a half marathon in the spring", "Idea"),
      I("Write an op-ed on AI in courts", "Idea", { show: dd(10) })
    ],
    props: [
      { id: "pr1", kind: "Approval", title: "Office hours clash with your seminar", date: dd(0),
        detail: "TA office hours (14:30–15:30) overlaps the Tech Policy seminar (13:30–15:00) today. Move office hours to 15:00–16:00? That slot is free.",
        action: { op: "update", calendarId: "work", eventId: "oh", startTime: dd(0) + "T15:00:00", endTime: dd(0) + "T16:00:00" } },
      { id: "pr2", kind: "Approval", title: "No prep time before tomorrow's interview", date: dd(1),
        detail: "Your Policy Fellowship interview is tomorrow at 14:00. Add “Interview prep” from 12:15 to 13:15 tomorrow? That slot is free.",
        action: { op: "create", calendarId: "work", summary: "Interview prep", startTime: dd(1) + "T12:15:00", endTime: dd(1) + "T13:15:00" } },
      { id: "pr3", kind: "Heads-up", title: "Problem set 5 is due tomorrow", date: dd(0), detail: "Tomorrow is packed. Today 17:00–19:30 is free if you want to finish it tonight." }
    ],
    qi: 0, thumb: null,
    tour: { brief: false, task: false, event: false, approve: false, bump: false, progress: false, again: false, photo: false, eventDay: 1 }
  };
}
function loadSample(fresh) {
  if (!fresh) { try { const v = JSON.parse(store.get(SKEY) || "null"); if (v && v.anchor === TODAY()) SD = v; } catch (e) { SD = null; } }
  if (!SD || fresh) SD = sampleWeek();
  S.items = SD.items; S.props = SD.props; S.events = SD.events;
  S.cals = KINDS.map((k) => ({ k: k.k, id: k.k, n: k.n }));
}
const saveSample = () => { if (S.mode === "sample" && SD) { SD.items = S.items; SD.props = S.props; SD.events = S.events; store.set(SKEY, JSON.stringify(SD)); } };
const tour = () => (S.mode === "sample" && SD ? SD.tour : null);
function mark(k) { const t = tour(); if (t && k) t[k] = true; saveSample(); }
function sawBrief() { const t = tour(); if (t) { t.brief = true; if (t.task || t.event) t.again = true; saveSample(); } }

// ================= live mode (your Google Calendar + Notion) =================
function unwrap(r) {
  let p = r && r.payload !== undefined ? r.payload : r;
  if (p && p.structuredContent) p = p.structuredContent;
  if (p && Array.isArray(p.content)) { const t = p.content.filter((c) => c.type === "text").map((c) => c.text).join(""); try { return JSON.parse(t); } catch (e) { return t; } }
  if (typeof p === "string") { try { return JSON.parse(p); } catch (e) { return p; } }
  return p;
}

- Something to hand in or finish by a date is a "task", with that date as "date".
- A long piece of work (paper, thesis, website, application) is a "project".
- "someday", "eventually" or a wish is an "idea" with no date.
- Exams and interviews are events (use the exams calendar if there is one) with bump true and show 14 days before the date (tomorrow if that has passed). All-day if no time is given.
- "bump me" or "remind me" on a date means bump true and show = that date.
- Title: short, keep names, drop date and time words.
- A weekday means the next one after today. Never invent details that are not there.

        <div class="line">${S.busy[sel.id] ? `<span class="muted">Saving…</span>` : `${sel.allDay ? "" : `<button class="btn sm pri" data-a="evSave" data-u="${esc(sel.id)}">Save time</button>`}<button class="btn sm danger" data-a="evDel" data-u="${esc(sel.id)}">Remove</button><button class="btn sm" data-a="evOpen" data-u="${esc(sel.id)}">Close</button>`}</div></div>`;
  }
  return `<span class="muted" style="color:#065F46">${lg ? gaps.length + " free gap" + (gaps.length > 1 ? "s" : "") + " · longest " + fm(lg[0]) + "–" + fm(lg[1]) : "No free time between 8:00 and 22:00"}</span>
    ${ad.map((x) => `<button class="allday" data-a="evOpen" data-u="${esc(x.id)}">All day · ${esc(x.t)}</button>`).join("")}
    ${ed}
    <div class="cal" style="height:${(D1 - D0) / 60 * HP}px">${h}</div>`;
}
function todoRow(i) {
  const [dt, dc] = dueLbl(i.due); const open = S.open === i.id; const pct = i.pct || 0; const bv = addDays(TODAY(), 7), u = esc(i.id);
  return `<div><div class="row">
      <input type="checkbox" aria-label="Mark ${esc(i.title)} done" data-a="done" data-u="${u}">
      <span class="t">${esc(i.title)}</span>
      ${pct ? `<span class="pill teal">${pct}%</span>` : ""}<span class="pill ${dc}">${dt}</span>
      <button class="icon" aria-label="Options for ${esc(i.title)}" aria-expanded="${open}" data-a="open" data-u="${u}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 12h16"></path><circle cx="9" cy="12" r="3"></circle></svg></button>
    </div>
    ${open ? `<div class="panel">
      <div class="line"><label for="pr-${u}" class="muted">How far?</label><input id="pr-${u}" type="range" min="0" max="100" step="10" value="${pct}" data-a="pct" data-u="${u}"><b>${pct}%</b></div>
      <div class="line"><label for="bd-${u}" class="muted">Bump until</label><input class="datein" id="bd-${u}" type="date" value="${bv}"><button class="btn sm" data-a="bump" data-u="${u}">Bump</button></div>
      <div class="line"><button class="btn sm" data-a="type" data-v="Project" data-u="${u}">Turn into project</button><button class="btn sm danger" data-a="del" data-u="${u}">Delete</button></div>
    </div>` : ""}</div>`;
}
function quickAddHTML() {
  const c = S.qa.card, q = S.qa;

  return `<div class="qa">
    <div class="qa-row"><label for="qa-in" class="sr">Quick add</label>
      <input id="qa-in" placeholder="Quick add: “pset due fri”, “coffee w Alex tmr 4pm”" value="${esc(q.text)}" data-f="qa">
      <button class="btn pri" data-a="qaGo" ${q.busy ? "disabled" : ""}>Add</button></div>
    <div class="chips">${tag("", "Auto")}${tag("event", "Event")}${tag("exam", "Exam / interview")}${tag("task", "To-do")}${tag("project", "Project")}${tag("idea", "Idea")}
      ${sampler && canImg ? `<label class="chip photo">📷 From a screenshot<input type="file" accept="image/*" aria-label="Add from a screenshot" data-f="photo"></label>` : ""}</div>
    ${S.mode === "sample" ? `<div class="chips"><span class="muted">Try:</span>${["coffee w Alex tmr 4pm", "pset 6 due fri", "stats midterm 15 dec, bump me on 5 dec", "someday learn to sail"].map((t) => `<button class="chip" data-a="qaEx" data-v="${esc(t)}">${esc(t)}</button>`).join("")}</div>` : ""}

    ${c ? `<div class="qcard">
      <span class="by ${q.by === "ai" ? "ai" : "rules"}">${q.by === "ai" ? "✨ Read by Claude" : "Read by simple rules"}${q.queue.length ? " · " + (q.queue.length + 1) + " items found" : ""}</span>
      <div class="f"><label for="qc-title">Title</label><input class="ctl" id="qc-title" value="${esc(c.title)}"></div>
      <div class="grid2">
        <div class="f"><label for="qc-kind">Type</label><select class="ctl" id="qc-kind" data-a="qcKind">${[["event", "Calendar event"], ["task", "To-do"], ["project", "Project"], ["idea", "Idea"]].map(([v, t]) => `<option value="${v}" ${c.kind === v ? "selected" : ""}>${t}</option>`).join("")}</select></div>
        ${c.kind !== "idea" ? `<div class="f"><label for="qc-date">${c.kind === "event" ? "Date" : c.kind === "project" ? "Deadline" : "Due (optional)"}</label><input class="ctl" type="date" id="qc-date" value="${esc(c.date)}"></div>` : ""}
        ${c.kind === "event" ? `

          <div class="f"><label for="qc-cal">Calendar</label><select class="ctl" id="qc-cal">${S.cals.map((x) => `<option value="${esc(x.k)}" ${x.k === c.cal ? "selected" : ""}>${esc(x.n)}</option>`).join("")}</select></div>` : ""}
      </div>
      ${c.kind === "event" ? `<label class="check"><input type="checkbox" id="qc-allDay" ${c.allDay ? "checked" : ""}>All-day</label>` : ""}
      <label class="check"><input type="checkbox" id="qc-bump" ${c.bump ? "checked" : ""} data-a="qcBump"><span><b>Bump me later:</b> ${c.kind === "event" ? "add a to-do “Plan for " + esc(c.title) + "”, hidden until a date" : c.kind === "task" ? "keep it off my list until a date" : c.kind === "project" ? "keep it under ‘Starting later’ until a date" : "keep it out of Ideas until a date"}</span></label>
      ${c.bump ? `<div class="grid2"><div class="f"><label for="qc-show">Show it from</label><input class="ctl" type="date" id="qc-show" value="${esc(c.show)}"></div></div>` : ""}
      <div class="qa-row"><button class="btn pri" style="flex:1" data-a="qaSave">${c.kind === "event" ? "Add to calendar" : c.kind === "task" ? "Add to to-do" : c.kind === "project" ? "Add project" : "Add idea"}</button><button class="btn" data-a="qaCancel">Cancel</button></div>

function homeView() {
  const T = TODAY();
  const todos = S.items.filter((i) => i.type === "To-do" && visibleOn(i, T)).sort(byDue);
  const projs = S.items.filter((i) => i.type === "Project" && visibleOn(i, T)).sort(byDue);
  const later = S.items.filter((i) => i.type === "Project" && bumpedNow(i));
  const ideas = S.items.filter((i) => i.type === "Idea" && visibleOn(i, T));
  const bumps = S.items.filter(bumpedNow).sort((a, b) => a.show < b.show ? -1 : 1);
  const appr = S.props.filter((p) => p.kind === "Approval"), heads = S.props.filter((p) => p.kind !== "Approval");
  const dueToday = todos.filter((i) => i.due && diff(i.due) <= 0).length, soon = todos.filter((i) => i.due && diff(i.due) > 0 && diff(i.due) <= 3).length;
  const tabs = [["today", "Today"], ["todo", "To-do"], ["projects", "Projects"], ["ideas", "Ideas"]];
  const loadingFirst = S.mode === "live" && S.loading && !S.synced;
  return `${quickAddHTML()}
  <div class="tabs" role="tablist">${tabs.map(([k, t]) => `<button class="tab ${S.tab === k ? "on" : ""}" role="tab" aria-selected="${S.tab === k}" data-a="tab" data-v="${k}">${t}</button>`).join("")}</div>
  <div class="cols">
    <div class="col left">
      <section class="card" data-tab="today">
        <div style="display:flex;justify-content:space-between;align-items:center"><h2>Calendar</h2>
          <div class="seg">${[[0, "Today"], [1, "Tomorrow"]].map(([k, t]) => `<button class="chip ${S.day === k ? "on" : ""}" data-a="day" data-v="${k}">${t}</button>`).join("")}</div></div>
        ${loadingFirst ? `<div class="empty">Loading your calendar…</div>` : calHTML(S.day)}
      </section>
      <section class="card ideas" data-tab="ideas">
        <div style="display:flex;justify-content:space-between"><h2>Long-term ideas</h2><span class="muted" style="color:#92400E">${ideas.length} ${ideas.length === 1 ? "idea" : "ideas"}</span></div>
        ${ideas.length ? ideas.map((i) => `<div class="row" style="border-color:#FDE68A"><span class="t">${esc(i.title)}</span><button class="btn sm" data-a="type" data-v="Project" data-u="${esc(i.id)}">Make project</button><button class="btn sm danger" aria-label="Delete ${esc(i.title)}" data-a="del" data-u="${esc(i.id)}">×</button></div>`).join("") : `<div class="empty">No ideas yet.</div>`}
        <div class="qa-row"><label for="idea-in" class="sr">Add an idea</label><input id="idea-in" class="ctl" style="border-color:#FCD34D;height:40px" placeholder="Jot an idea…" data-f="idea"><button class="btn sm" style="background:#B45309;border-color:#B45309;color:#fff;min-height:40px" data-a="addIdea">Add</button></div>
        <span class="muted" style="color:#92400E">Ideas stay out of the daily briefs unless you ask.</span>
      </section>
    </div>
    <div class="col right">
      <section class="card" data-tab="today" id="appr">
        <h2>Pending approval (${appr.length})</h2>
        <span class="muted">Found by the nightly check. Nothing changes until you approve.</span>
        ${appr.length ? appr.map((p) => `<div class="prop"><span class="muted">Nightly check${p.date ? " · " + (diff(p.date) === 0 ? "today" : diff(p.date) === 1 ? "tomorrow" : short(p.date)) : ""}</span><b>${esc(p.title)}</b><span>${esc(p.detail || "")}</span>
          <div class="qa-row">${S.busy[p.id] ? `<span class="muted">Applying…</span>` : `<button class="btn pri" style="flex:1" data-a="approve" data-u="${esc(p.id)}">Approve</button><button class="btn" style="flex:1" data-a="skip" data-v="Skipped" data-u="${esc(p.id)}">Skip</button>`}</div></div>`).join("") : `<div class="empty">Nothing needs your OK.</div>`}
        ${heads.length ? `<h2 style="margin-top:6px">Heads-up</h2>` + heads.map((p) => `<div class="prop"><b>${esc(p.title)}</b><span>${esc(p.detail || "")}</span><div><button class="btn sm" data-a="skip" data-v="Seen" data-u="${esc(p.id)}">Got it</button></div></div>`).join("") : ""}
      </section>
      <section class="card" data-tab="todo" id="todos">
        <div style="display:flex;justify-content:space-between"><h2>To-do</h2><span class="muted">${dueToday} today · ${soon} soon</span></div>
        ${todos.length ? todos.map(todoRow).join("") : `<div class="empty">${loadingFirst ? "Loading…" : "Nothing on your list."}</div>`}
      </section>
      <section class="card" data-tab="projects">
        <h2>Projects</h2>
        ${projs.length ? projs.map((p) => `<div style="display:flex;flex-direction:column;gap:6px;border-top:1px solid #F3F4F6;padding-top:8px">
          <div style="display:flex;justify-content:space-between;gap:8px"><b style="font-weight:500">${esc(p.title)}</b><span class="muted">${p.due ? "Due " + short(p.due) : "No deadline"}</span></div>
          <div class="line"><label class="sr" for="pp-${esc(p.id)}">Progress for ${esc(p.title)}</label><input id="pp-${esc(p.id)}" type="range" min="0" max="100" step="5" value="${p.pct || 0}" data-a="pct" data-u="${esc(p.id)}"><b style="width:36px;text-align:right">${p.pct || 0}%</b></div>
          <div style="display:flex;gap:6px"><button class="btn sm" data-a="type" data-v="To-do" data-u="${esc(p.id)}">Move to to-do</button><button class="btn sm danger" data-a="del" data-u="${esc(p.id)}">Delete</button></div></div>`).join("") : `<div class="empty">No projects yet.</div>`}
        ${later.length ? `<button class="btn sm" style="align-self:flex-start;border:none;padding:0;background:transparent" aria-expanded="${S.laterOpen}" data-a="laterToggle">${S.laterOpen ? "▾" : "▸"} Starting later (${later.length})</button>
          ${S.laterOpen ? later.map((p) => `<div class="row"><span class="t">${esc(p.title)}<br><span class="muted">shows from ${short(p.show)}</span></span><button class="btn sm" data-a="showNow" data-u="${esc(p.id)}">Start now</button></div>`).join("") : ""}` : ""}
        <span class="muted">You move the slider yourself. The bot never estimates your progress or how long things take.</span>
      </section>
      <section class="card bumped" data-tab="todo">
        <button class="btn sm" style="border:none;background:transparent;justify-content:space-between;display:flex;align-items:center;width:100%;padding:0;font-weight:600" aria-expanded="${S.bumpedOpen}" data-a="bumpedToggle"><span>${S.bumpedOpen ? "▾" : "▸"} Bumped for later (${bumps.length})</span><span style="color:#0F766E;font-weight:500">${S.bumpedOpen ? "Hide" : "Show all"}</span></button>
        ${S.bumpedOpen ? (bumps.length ? bumps.map((i) => `<div class="row"><span class="pill ${i.type === "Project" ? "blue" : i.type === "Idea" ? "amber" : "teal"}">${esc(i.type)}</span><span class="t">${esc(i.title)}<br><span class="muted">back ${nice(i.show)}</span></span><button class="btn sm" data-a="showNow" data-u="${esc(i.id)}">Show now</button></div>`).join("") : `<div class="empty">Nothing bumped.</div>`) : ""}
      </section>
    </div>
  </div>`;
}
function aboutView() {
  const box = (cls, b, t) => `<div class="box ${cls}"><b>${b}</b>${t}</div>`;
  const row = (lbl, boxes) => `<div class="flowrow"><div class="lbl">${lbl}</div><div class="boxes">${boxes}</div></div>`;
  return `<div class="prose">
    <div><h3>How it works</h3><p class="muted" style="font-size:13px;margin-top:4px">An AI chief of staff for your to-dos and calendar. You start each day knowing what's coming, and it never changes your calendar without your OK.</p></div>
    <div style="display:flex;flex-direction:column;gap:6px">
      ${row("You put things in", box("b-you", "Quick add", "Type a note here. Claude reads it.") + box("b-you", "Photo or message", "Send a screenshot of a poster or email in a Claude chat.") + box("b-you", "Google Calendar", "Or just edit your calendar directly."))}
      <div class="arrow" aria-hidden="true">↓</div>
      ${row("Where it lives", box("b-store", "Google Calendar", "Events, on calendars by kind: classes, deadlines, exams, social…") + box("b-store", "Notion", "To-dos, projects, ideas, plus the bot's proposals."))}
      <div class="arrow" aria-hidden="true">↓</div>
      ${row("Runs on its own", box("b-run", "8 pm evening brief", "Claude scheduled task, every day.") + box("b-run", "Morning brief", "Claude scheduled task; reads the calendar fresh.") + box("b-run", "Nightly check (optional)", "A small agent on GitHub Actions looks for clashes and gaps."))}
      <div class="arrow" aria-hidden="true">↓</div>
      ${row("Comes back to you", box("b-back", "Brief in Claude", "New chat + notification, with the day drawn to scale.") + box("b-back", "This page", "Proposals wait for Approve or Skip; one tap applies them."))}
    </div>
    <div><h3>Design choices</h3></div>
    <div class="choices">
      <div class="cbox"><b>You approve every calendar change</b>Saving in Quick add counts as approval. The nightly check can only suggest.</div>
      <div class="cbox"><b>No hours</b>It never blocks time for you or guesses how long things take. You move the progress slider.</div>
      <div class="cbox"><b>Bump, don't drop</b>Anything can be hidden until a date and comes back on its own.</div>
      <div class="cbox"><b>No email reading</b>You decide what goes in. Less access, less to go wrong.</div>
      <div class="cbox"><b>Safe deletes</b>Deletes have undo. The nightly check can't delete anything; that's enforced in code.</div>
      <div class="cbox"><b>Always fresh</b>Briefs re-read the calendar each time, so late-night edits show up in the morning.</div>
    </div>
    <div class="card"><h3>Get it on your own accounts</h3>
      <ol class="steps">
        <li>Download <a href="${esc(ZIP)}">chief-of-staff-skill.zip</a> from <a href="${esc(CONFIG.repo)}">the GitHub repo</a>.</li>
        <li>In Claude, go to <b>Customize → Skills</b>, tap <b>+</b>, then <b>Create skill → Upload a skill</b>, and choose the zip.</li>
        <li>Connect the <b>Notion</b> and <b>Google Calendar</b> connectors.</li>
        <li>In a new chat, say <b>“Set up my chief of staff.”</b> Claude creates your Notion lists, asks which calendars to use, builds your own copy of this page and schedules your two briefs.</li></ol>
      <span class="muted">Needs a Claude plan with skills and scheduled tasks, plus free Notion and Google accounts. The optional nightly check has its own setup in the repo.</span></div>
    <p class="muted">Built with Claude for DPI-681 by Megan.</p>
  </div>`;
}

function render() {
  const app = document.getElementById("app"); if (!app) return;
  if (!S.mode) { app.innerHTML = gateHTML(); return; }
  const active = document.activeElement && document.activeElement.id;
  const navs = [["home", "Home"], ["briefs", "Briefs"], ["about", "About"]];
  const body = S.view === "briefs" ? briefsView() : S.view === "about" ? aboutView() : homeView();
  const live = S.mode === "live";
  app.innerHTML = `
  <div class="top"><div><h1>Chief of Staff</h1>
    <div class="mode">${live ? `<span class="pill teal">Your accounts</span><span class="muted">${S.loading ? "Syncing…" : S.synced ? "Synced " + S.synced.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }) : ""}</span>` : `<span class="pill violet">Sample week</span>`}
      <button class="linkbtn" data-a="switchMode">${live ? "Switch to sample" : "Use my accounts"}</button></div></div>
    <div class="line" style="justify-content:flex-end">${live ? `<button class="btn sm" data-a="refresh">Refresh</button>` : `<button class="btn sm" data-a="resetSample">Reset sample</button>`}</div></div>
  <nav class="nav" aria-label="Sections">${navs.map(([k, t]) => `<a href="#${k}" class="${S.view === k ? "on" : ""}" ${S.view === k ? 'aria-current="page"' : ""}>${t}</a>`).join("")}</nav>
  ${S.err ? `<div class="err" role="alert"><span>${esc(S.err)}</span>${S.errSample ? `<div><button class="btn sm" data-a="choose" data-v="sample">Try the sample week instead</button></div>` : ""}</div>` : ""}
  ${S.mode === "sample" && S.view !== "about" ? tourHTML() : ""}
  ${S.mode === "sample" && S.view === "home" ? `<p class="note">You're on a made-up student's week. Nothing touches your accounts; changes stay in this browser. Dates move with today.</p>` : ""}
  ${body}
  ${S.undo ? `<div class="undo" role="status"><span>${esc(S.undo.text)}</span>${S.undo.undoFn ? `<button data-a="undo">Undo</button>` : ""}</div>` : ""}`;
  if (active === "qa-in" || active === "idea-in") { const el = document.getElementById(active); if (el) { el.focus(); const n = el.value.length; try { el.setSelectionRange(n, n); } catch (e) {} } }
}
function route() {
  const h = location.hash.replace("#", "");
  S.view = ["home", "briefs", "about"].includes(h) ? h : "home";
  if (S.view === "briefs") sawBrief();
  render(); window.scrollTo(0, 0);
}

// ================= events =================
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-a]"); if (!b || b.tagName === "INPUT" || b.tagName === "SELECT") return;
  const a = b.dataset.a, u = b.dataset.u, v = b.dataset.v;
  if (a === "undo") { const f = S.undo && S.undo.undoFn; if (S.undo) clearTimeout(S.undo.timer); S.undo = null; if (f) f(); render(); return; }
  if (a === "type" || a === "skip") return A[a](u, v);
  if (A[a]) return u !== undefined ? A[a](u) : A[a](v);
});
document.addEventListener("change", (e) => {
  const t = e.target, a = t.dataset.a;
  if (a === "done") A.done(t.dataset.u);
  else if (a === "pct") A.pct(t.dataset.u, t.value);
  else if (a === "qcKind" || a === "qcBump") { S.qa.card = Object.assign(readCard(), a === "qcKind" ? { kind: t.value } : { bump: t.checked }); render(); }
  else if (t.dataset.f === "photo" && t.files && t.files[0]) readNote("", t.files[0]);
});
document.addEventListener("input", (e) => { if (e.target.dataset && e.target.dataset.f === "qa") S.qa.text = e.target.value; });
document.addEventListener("keydown", (e) => {
  if (e.key !== "Enter" || !e.target.dataset) return;
  if (e.target.dataset.f === "qa") { e.preventDefault(); A.qaGo(); }
  else if (e.target.dataset.f === "idea") { e.preventDefault(); A.addIdea(); }
  else if (e.target.dataset.a === "evOpen") { e.preventDefault(); A.evOpen(e.target.dataset.u); }
});
window.addEventListener("hashchange", route);

// ================= start =================
(function start() {
  const saved = store.get("cos-mode");
  if (saved === "sample") { S.mode = "sample"; loadSample(false); }
  route();
  (async () => {
    const use = window.claude && typeof window.claude.use === "function" ? window.claude.use : null;
    if (use) {
      try { mcp = await window.claude.use("mcp"); } catch (e) { mcp = null; }
      try { sampler = await window.claude.use("sample"); if (sampler && typeof sampler.limits === "function") { const l = await sampler.limits(); canImg = !!(l && l.images); } } catch (e) { sampler = null; }
    }
    mcpChecked = true;
    if (saved === "live" && LINKED && mcp) chooseMode("live");
    else render();
  })();
})();
</script>
